<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Right Now | Manifestalk</title>
<style>
  :root{
    --cream:#F3ECDD;
    --paper:#FBF8F1;
    --ink:#2B1E12;
    --walnut:#6E4A28;
    --walnut-dark:#4A3018;
    --gold:#B98D4F;
    --gold-light:#E4C99A;
    --moss:#55624A;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .device{
    width:420px;
    max-width:100%;
    min-height:720px;
    background:var(--paper);
    border-radius:28px;
    box-shadow:0 30px 60px -20px rgba(43,30,18,0.35);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .lang-toggle{
    position:absolute;
    top:18px;
    right:18px;
    z-index:10;
    background:var(--cream);
    border:1.5px solid var(--gold);
    color:var(--walnut);
    font-family:var(--sans);
    font-weight:700;
    font-size:12px;
    letter-spacing:0.03em;
    padding:7px 13px;
    border-radius:999px;
    cursor:pointer;
  }
  .lang-toggle:hover{background:var(--gold-light);}
  .screen{
    display:none;
    flex-direction:column;
    flex:1;
    padding:40px 32px 32px;
  }
  .screen.active{display:flex;}

  .eyebrow-mark{
    display:flex; align-items:center; gap:10px; margin-bottom:auto;
  }
  .dandelion{width:26px;height:26px;flex-shrink:0;}
  .brandname{
    font-family:var(--serif);
    letter-spacing:0.14em;
    font-size:13px;
    color:var(--walnut);
  }

  h1{
    font-family:var(--sans);
    font-weight:800;
    font-size:38px;
    line-height:1.05;
    letter-spacing:-0.01em;
    color:var(--ink);
    margin:28px 0 16px;
    max-width:11ch;
  }
  h2{
    font-family:var(--sans);
    font-weight:800;
    font-size:26px;
    line-height:1.05;
    color:var(--ink);
    margin-bottom:8px;
  }
  p.lead{
    font-family:var(--serif);
    font-size:16px;
    line-height:1.55;
    color:#4A3E30;
    max-width:32ch;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--walnut);
    color:var(--paper);
    font-family:var(--sans);
    font-weight:700;
    font-size:15px;
    padding:15px 22px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    width:100%;
    transition:background 0.2s ease, transform 0.15s ease;
  }
  .btn:hover{background:var(--walnut-dark); transform:translateY(-1px);}
  .btn.ghost{
    background:transparent;
    color:var(--walnut);
    border:1.5px solid var(--walnut);
  }
  .btn.ghost:hover{background:rgba(110,74,40,0.06); transform:none;}
  .btn-row{display:flex; flex-direction:column; gap:10px; margin-top:20px;}
  .link-back{
    font-family:var(--sans); font-size:13px; color:var(--moss);
    background:none;border:none;cursor:pointer;text-align:left;
    padding:0; margin-bottom:18px; display:flex; align-items:center; gap:6px;
  }

  .theme-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:22px;
  }
  .theme-card{
    background:var(--cream);
    border:1.5px solid transparent;
    border-radius:18px;
    padding:16px 14px;
    cursor:pointer;
    text-align:left;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .theme-card:hover{border-color:var(--gold);}
  .theme-card .badge{
    width:40px;height:40px;border-radius:50%;
    background:var(--walnut);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:12px;
  }
  .theme-card .badge svg{width:20px;height:20px;stroke:var(--gold-light);}
  .theme-card .t-name{font-family:var(--sans);font-weight:700;font-size:14.5px;color:var(--ink);}
  .theme-card .t-sub{font-family:var(--serif);font-size:12px;color:var(--moss);margin-top:2px;}

  #draw{align-items:center; text-align:center;}
  .card-stage{
    width:220px;height:300px;
    margin:18px auto 26px;
    perspective:1200px;
  }
  .card-inner{
    width:100%;height:100%;
    position:relative;
    transition:transform 0.9s cubic-bezier(.2,.8,.2,1);
    transform-style:preserve-3d;
    cursor:pointer;
  }
  .card-inner.flipped{transform:rotateY(180deg);}
  .card-face{
    position:absolute; inset:0;
    border-radius:16px;
    backface-visibility:hidden;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 18px 30px -12px rgba(43,30,18,0.4);
  }
  .card-back{
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.08), transparent 40%),
      var(--walnut);
  }
  .card-back .dot-field{width:70px;height:70px;opacity:0.55;}
  .card-front{
    background:var(--paper);
    transform:rotateY(180deg);
    flex-direction:column;
    padding:18px;
  }
  .card-front .art{width:100%;height:56%;border-radius:10px;overflow:hidden;margin-bottom:12px;background:var(--cream);}
  .card-front .art svg{width:100%;height:100%;}
  .card-front .art img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-front .theme-tag{
    font-family:var(--sans);font-size:11px;font-weight:700;
    color:var(--walnut); letter-spacing:0.04em;
  }
  .card-front .card-title{
    font-family:var(--sans);font-weight:800;font-size:17px;color:var(--ink);margin-top:2px;
  }
  .tap-hint{font-family:var(--serif);font-size:13px;color:var(--moss);font-style:italic;}

  .reveal-block{display:none; margin-top:4px; text-align:left; width:100%;}
  .reveal-block.show{display:block;}
  .reveal-block .q{
    font-family:var(--serif); font-size:17px; line-height:1.5; color:var(--ink);
    border-left:3px solid var(--gold); padding-left:14px; margin-bottom:20px;
  }

  textarea{
    width:100%; min-height:80px; border-radius:14px; border:1.5px solid #E4D9C2;
    background:var(--cream); padding:14px; font-family:var(--serif); font-size:14px;
    color:var(--ink); resize:none;
  }
  textarea:focus{outline:none; border-color:var(--gold);}
  .skip{
    font-family:var(--sans); font-size:12.5px; color:var(--moss);
    text-align:center; background:none; border:none; cursor:pointer; margin-top:12px;
  }

  #reflect .tag{
    font-family:var(--sans); font-size:11px; font-weight:700; color:var(--gold);
    letter-spacing:0.05em; margin-bottom:10px;
  }
  .reflection-text{
    font-family:var(--serif); font-size:19px; line-height:1.6; color:var(--ink);
    margin-bottom:28px;
  }
  .reflection-card{
    background:var(--walnut); color:var(--paper); border-radius:18px; padding:22px;
    margin-bottom:22px;
  }
  .reflection-card .reflection-text{color:var(--gold-light); margin-bottom:0;}

  #cta{align-items:flex-start;}
  .cta-block{
    background:var(--cream); border-radius:16px; padding:18px; margin-bottom:12px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .cta-block .l-title{font-family:var(--sans);font-weight:700;font-size:14px;color:var(--ink);}
  .cta-block .l-sub{font-family:var(--serif);font-size:12.5px;color:var(--moss);margin-top:2px;}
  .mini-btn{
    font-family:var(--sans); font-size:12.5px; font-weight:700; color:var(--paper);
    background:var(--walnut); border:none; border-radius:999px; padding:9px 16px; cursor:pointer;
    white-space:nowrap;
  }
</style>
</head>
<body>

<div class="device">

    <div class="card-stage">

        <div class="l-sub" data-i18n="cta2Sub"></div>
      </div>
      <button class="mini-btn" data-i18n="cta2Btn"></button>
    </div>
    <div class="cta-block">
      <div>
        <div class="l-title" data-i18n="cta3Title"></div>
        <div class="l-sub" data-i18n="cta3Sub"></div>
      </div>
      <button class="mini-btn" data-i18n="cta3Btn"></button>

    <button class="btn ghost" style="margin-top:auto;" data-i18n="ctaAgain" onclick="go('landing')"></button>
  </div>

</div>

let lastShownReflectionIndex = {};

let lang = 'id';
let currentTheme = 'Mindfulness';

function applyLang(){
  const dict = i18n[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(dict[key] !== undefined) el.textContent = dict[key];
  });
  document.getElementById('reasonInput').placeholder = dict.reasonPlaceholder;
  document.getElementById('langToggle').textContent = lang === 'id' ? 'EN' : 'ID';
  document.getElementById('reflectQ').textContent = themeMeta[currentTheme].q[lang];
  document.getElementById('reflectionText').textContent = reflectionVariations[currentTheme][lang][currentReflectionIdx];
}

function toggleLang(){
  lang = lang === 'id' ? 'en' : 'id';
  applyLang();
}

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='draw'){
    document.getElementById('cardInner').classList.remove('flipped');
    document.getElementById('revealBlock').classList.remove('show');
    document.querySelector('.tap-hint').style.display='block';
  }
}

function pickTheme(name){
  currentTheme = name;
  document.getElementById('draw-heading').textContent = name;
  document.getElementById('cardTag').textContent = name.toUpperCase();
  document.getElementById('cardTitle').textContent = themeMeta[name].sub;

  const options = photoUnsplashIds[name];
  let idx = Math.floor(Math.random() * options.length);
  if(options.length > 1 && idx === lastShownIndex[name]){
    idx = (idx + 1) % options.length;
  }
  lastShownIndex[name] = idx;
  document.getElementById('cardArt').innerHTML = `<img src="${ph(options[idx])}" alt="${name}" style="width:100%;height:100%;object-fit:cover;">`;

  document.getElementById('reflectQ').textContent = themeMeta[name].q[lang];

  const reflOptions = reflectionVariations[name].id;
  let rIdx = Math.floor(Math.random() * reflOptions.length);
  if(reflOptions.length > 1 && rIdx === lastShownReflectionIndex[name]){
    rIdx = (rIdx + 1) % reflOptions.length;
  }
  lastShownReflectionIndex[name] = rIdx;
  currentReflectionIdx = rIdx;
  document.getElementById('reflectionText').textContent = reflectionVariations[name][lang][rIdx];

  go('draw');
}

function flipCard(){
  document.getElementById('cardInner').classList.add('flipped');
  document.querySelector('.tap-hint').style.display='none';
  setTimeout(()=>{
    document.getElementById('revealBlock').classList.add('show');
  }, 500);
}
